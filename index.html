<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
    <style>
        :root{
            --bg:#ffffff;
            --fg:#000000;
        }
        .dark{
            --bg:#0d1117;
            --fg:#e6edf3;
        }
        body{background:var(--bg);color:var(--fg);transition:background .2s,color .2s}
        .theme-toggle{
            position:fixed;right:12px;bottom:12px;z-index:9999;
            width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            background:rgba(0,0,0,0.08);backdrop-filter:blur(4px);cursor:pointer;border:1px solid rgba(0,0,0,0.06)
        }
        .theme-toggle img{width:20px;height:20px;display:block;border-radius:50%}
        /* navbar dark adjustments */
        .dark .navbar{
            background:#141618 !important;
            border-bottom:1px solid rgba(255,255,255,0.03);
        }
        .dark .navbar .navbar-brand,
        .dark .navbar .nav-link,
        .dark .navbar .dropdown-toggle{
            color:var(--fg) !important;
        }
        .dark .navbar .form-control{
            background:rgba(255,255,255,0.02) !important;
            color:var(--fg) !important;
            border-color:rgba(255,255,255,0.06) !important;
        }
        .dark .navbar-toggler{border-color:rgba(255,255,255,0.12)}
        .dark .navbar-toggler-icon{filter:invert(1) brightness(1.6)}
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Geração tech</a>
            <button class="navbar-toggler" type="button"     data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            edições
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">1.0</a></li>
                            <li><a class="dropdown-item" href="#">2.0</a></li>
                             <li><a class="dropdown-item" href="#">3.0</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Fale com a coordenação</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
                <form class="d-flex" role="Procurar">
                    <input class="form-control me-2" type="search" placeholder="Digite sua pesquisa" aria-label="Procurar" />
                    <button class="btn btn-outline-success" type="submit">Procurar</button>
                </form>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <div class="theme-toggle" id="themeToggle" title="Alternar tema">
        <img id="themeIcon" src="https://png.pngtree.com/png-vector/20191027/ourmid/pngtree-yin-yang-glyph-icon-vector-png-image_1886219.jpg" alt="Yin Yang">
    </div>
    <script>
        (function(){
            const root = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            function setDark(d){
                if(d){
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
            }
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            let isDark = saved ? saved === 'dark' : prefersDark;
            setDark(isDark);
            toggle.addEventListener('click', ()=>{
                isDark = !isDark;
                setDark(isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        })();
    </script>
</body>

</html>
